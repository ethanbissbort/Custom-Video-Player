name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS, SwiftPM)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme CustomVideoPlayer

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme CustomVideoPlayer \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
