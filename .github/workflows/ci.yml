name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS, SwiftPM)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # The repo root contains a dangling `_Pods.xcodeproj` symlink (points at the
      # CocoaPods-generated project, which only exists after `pod install`). Left
      # in place, xcodebuild's project auto-discovery trips over it instead of
      # building the Swift package. Remove it from the checkout before building.
      - name: Remove dangling Pods symlink
        run: rm -f _Pods.xcodeproj

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme CustomVideoPlayer

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme CustomVideoPlayer \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Resolve a concrete simulator rather than hardcoding a device name, so the job
      # keeps working when the runner image ships a different iPhone generation.
      - name: Select an iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for runtime, devices in sorted(runtimes.items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      print(device['udid'])
                      sys.exit(0)
          sys.exit('No available iPhone simulator found')
          ")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme CustomVideoPlayer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  example:
    name: Build Example (CocoaPods)
    runs-on: macos-15
    defaults:
      run:
        working-directory: Example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          pod --version

      - name: CocoaPods install
        run: pod install

      # Builds the example app, the locally-pathed CustomVideoPlayer pod, and the
      # test bundle (the shared scheme wires the tests as a testable), so the whole
      # CocoaPods consumer path is compiled. `build-for-testing` compiles the test
      # target without needing a booted simulator.
      - name: Build example workspace for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -workspace Custom-Video-Player.xcworkspace \
            -scheme Custom-Video-Player-Example \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Validates the Mac Catalyst ("Marzipan") build path — the same app target
      # compiled for macOS. Reuses the pods installed above.
      - name: Build example workspace for Mac Catalyst
        run: |
          xcodebuild build \
            -workspace Custom-Video-Player.xcworkspace \
            -scheme Custom-Video-Player-Example \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO
